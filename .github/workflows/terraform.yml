name: Terraform

# No production apply job exists; production promotion is intentionally disabled pending explicit approval.

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: read
  id-token: write

defaults:
  run:
    working-directory: infra

jobs:
  plan:
    name: Terraform validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.9

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  apply-nonproduction:
    name: Apply Terraform (dev or staging)
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push' && github.ref_type == 'branch'
    environment:
      name: ${{ github.ref == 'refs/heads/master' && 'staging' || 'dev' }}
    env:
      TF_VAR_environment: ${{ github.ref == 'refs/heads/master' && 'staging' || 'dev' }}
      TF_VAR_cost_alert_email: ${{ secrets.COST_ALERT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.9

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -input=false \
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
          -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
          -backend-config="key=infra/${TF_VAR_environment}/terraform.tfstate"

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: terraform apply
        run: terraform apply -input=false -auto-approve tfplan
