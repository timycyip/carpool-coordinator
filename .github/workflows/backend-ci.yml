name: Backend CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: pip install --upgrade pip && pip install uv

      - name: Set up Python
        run: uv python install 3.12

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: pip install --upgrade pip && pip install uv

      - name: Set up Python
        run: uv python install 3.12

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev

      - name: mypy
        run: uv run mypy .

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-2
      AWS_ACCESS_KEY_ID: fake
      AWS_SECRET_ACCESS_KEY: fake
      AWS_SESSION_TOKEN: fake
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: pip install --upgrade pip && pip install uv

      - name: Set up Python
        run: uv python install 3.12

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev

      - name: pytest with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  build-and-deploy:
    name: Build & deploy Lambda
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://carpool-dev.lambda-url.us-east-2.on.aws/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: pip install --upgrade pip && pip install uv

      - name: Set up Python
        run: uv python install 3.12

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Package Lambda
        run: |
          mkdir -p build/app
          cp -r app/* build/app/
          cp pyproject.toml uv.lock build/
          (cd build && uv export --no-dev --no-hashes --format requirements.txt -o requirements.txt)
          (cd build && uv pip install --python 3.12 --no-cache -r requirements.txt --target ./python)
          (cd build && zip -r ../lambda.zip . -x "*.pyc" -x "*__pycache__*")
          ls -lh lambda.zip

      - name: Upload artifact to S3 (SSE-KMS, NFR-SEC-4)
        env:
          ARTIFACT_BUCKET: carpool-dev-lambda-deploy
        run: |
          aws s3 cp lambda.zip s3://${ARTIFACT_BUCKET}/lambda.zip \
            --sse aws:kms \
            --sse-kms-key-id alias/aws/s3

      - name: Update Lambda function code
        env:
          FUNCTION_NAME: carpool-dev
          ARTIFACT_BUCKET: carpool-dev-lambda-deploy
        run: |
          aws lambda update-function-code \
            --function-name ${FUNCTION_NAME} \
            --s3-bucket ${ARTIFACT_BUCKET} \
            --s3-key lambda.zip

      - name: Wait for update to finish
        env:
          FUNCTION_NAME: carpool-dev
        run: |
          aws lambda wait function-updated --function-name ${FUNCTION_NAME}
